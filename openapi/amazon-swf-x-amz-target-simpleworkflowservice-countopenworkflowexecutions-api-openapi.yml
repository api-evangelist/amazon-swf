paths:
  /#X-Amz-Target=SimpleWorkflowService.CountOpenWorkflowExecutions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CountOpenWorkflowExecutions
      description: '<p>Returns the number of open workflow executions within the given domain that meet the specified filtering criteria.</p> <note> <p>This operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.</p> </note> <p> <b>Access Control</b> </p> <p>You can use IAM policies to control this action''s access to Amazon SWF resources as follows:</p> <ul> <li> <p>Use a <code>Resource</code> element with the domain name to limit the action to only specified domains.</p> </li> <li> <p>Use an <code>Action</code> element to allow or deny permission to call this action.</p> </li> <li> <p>Constrain the following parameters by using a <code>Condition</code> element with the appropriate keys.</p> <ul> <li> <p> <code>tagFilter.tag</code>: String constraint. The key is <code>swf:tagFilter.tag</code>.</p> </li> <li> <p> <code>typeFilter.name</code>: String constraint. The key is <code>swf:typeFilter.name</code>.</p> </li> <li> <p> <code>typeFilter.version</code>: String constraint. The key is <code>swf:typeFilter.version</code>.</p> </li> </ul> </li> </ul> <p>If the caller doesn''t have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute''s <code>cause</code> parameter is set to <code>OPERATION_NOT_PERMITTED</code>. For details and example IAM policies, see <a href="https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html">Using IAM to Manage Access to Amazon SWF Workflows</a> in the <i>Amazon SWF Developer Guide</i>.</p>'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionCount'
        '480':
          description: UnknownResourceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownResourceFault'
        '481':
          description: OperationNotPermittedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotPermittedFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountOpenWorkflowExecutionsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SimpleWorkflowService.CountOpenWorkflowExecutions
        example: SimpleWorkflowService.CountOpenWorkflowExecutions
      summary: Amazon SWF Count Open Workflow Executions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SimpleWorkflowService.CountOpenWorkflowExecutions'
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    WorkflowId:
      type: string
      minLength: 1
      maxLength: 256
    UnknownResourceFault: {}
    TagFilter:
      type: object
      required:
      - tag
      properties:
        tag:
          allOf:
          - $ref: '#/components/schemas/Tag'
          - description: '<p> Specifies the tag that must be associated with the execution for it to meet the filter criteria.</p> <p>Tags may only contain unicode letters, digits, whitespace, or these symbols: <code>_ . : / = + - @</code>.</p>'
      description: Used to filter the workflow executions in visibility APIs based on a tag.
    Tag:
      type: string
      minLength: 0
      maxLength: 256
    Truncated:
      type: boolean
    Count:
      type: integer
      minimum: 0
    WorkflowTypeFilter:
      type: object
      required:
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: ' Name of the workflow type.'
        version:
          allOf:
          - $ref: '#/components/schemas/VersionOptional'
          - description: Version of the workflow type.
      description: Used to filter workflow execution query results by type. Each parameter, if specified, defines a rule that must be satisfied by each returned result.
    DomainName:
      type: string
      minLength: 1
      maxLength: 256
    OperationNotPermittedFault: {}
    WorkflowExecutionFilter:
      type: object
      required:
      - workflowId
      properties:
        workflowId:
          allOf:
          - $ref: '#/components/schemas/WorkflowId'
          - description: The workflowId to pass of match the criteria of this filter.
      description: Used to filter the workflow executions in visibility APIs by their <code>workflowId</code>.
    VersionOptional:
      type: string
      maxLength: 64
    Name:
      type: string
      minLength: 1
      maxLength: 256
    CountOpenWorkflowExecutionsInput:
      type: object
      required:
      - domain
      - startTimeFilter
      title: CountOpenWorkflowExecutionsInput
      properties:
        domain:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain containing the workflow executions to count.
        startTimeFilter:
          allOf:
          - $ref: '#/components/schemas/ExecutionTimeFilter'
          - description: Specifies the start time criteria that workflow executions must meet in order to be counted.
        typeFilter:
          allOf:
          - $ref: '#/components/schemas/WorkflowTypeFilter'
          - description: <p>Specifies the type of the workflow executions to be counted.</p> <note> <p> <code>executionFilter</code>, <code>typeFilter</code> and <code>tagFilter</code> are mutually exclusive. You can specify at most one of these in a request.</p> </note>
        tagFilter:
          allOf:
          - $ref: '#/components/schemas/TagFilter'
          - description: <p>If specified, only executions that have a tag that matches the filter are counted.</p> <note> <p> <code>executionFilter</code>, <code>typeFilter</code> and <code>tagFilter</code> are mutually exclusive. You can specify at most one of these in a request.</p> </note>
        executionFilter:
          allOf:
          - $ref: '#/components/schemas/WorkflowExecutionFilter'
          - description: <p>If specified, only workflow executions matching the <code>WorkflowId</code> in the filter are counted.</p> <note> <p> <code>executionFilter</code>, <code>typeFilter</code> and <code>tagFilter</code> are mutually exclusive. You can specify at most one of these in a request.</p> </note>
    Timestamp:
      type: string
      format: date-time
    WorkflowExecutionCount:
      type: object
      required:
      - count
      properties:
        count:
          allOf:
          - $ref: '#/components/schemas/Count'
          - description: The number of workflow executions.
        truncated:
          allOf:
          - $ref: '#/components/schemas/Truncated'
          - description: If set to true, indicates that the actual count was more than the maximum supported by this API and the count returned is the truncated value.
      description: 'Contains the count of workflow executions returned from <a>CountOpenWorkflowExecutions</a> or <a>CountClosedWorkflowExecutions</a> '
    ExecutionTimeFilter:
      type: object
      required:
      - oldestDate
      properties:
        oldestDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Specifies the oldest start or close date and time to return.
        latestDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Specifies the latest start or close date and time to return.
      description: 'Used to filter the workflow executions in visibility APIs by various time-based rules. Each parameter, if specified, defines a rule that must be satisfied by each returned query result. The parameter values are in the <a href="https://en.wikipedia.org/wiki/Unix_time">Unix Time format</a>. For example: <code>"oldestDate": 1325376070.</code> '
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
