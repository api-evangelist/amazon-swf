tags:
- name: '#X Amz Target=SimpleWorkflowService.DescribeDomain'
paths:
  /#X-Amz-Target=SimpleWorkflowService.DescribeDomain:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeDomain
      description: <p>Returns information about the specified domain, including description and status.</p> <p> <b>Access Control</b> </p> <p>You can use IAM policies to control this action's access to Amazon SWF resources as follows:</p> <ul> <li> <p>Use a <code>Resource</code> element with the domain name to limit the action to only specified domains.</p> </li> <li> <p>Use an <code>Action</code> element to allow or deny permission to call this action.</p> </li> <li> <p>You cannot use an IAM policy to constrain this action's parameters.</p> </li> </ul> <p>If the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's <code>cause</code> parameter is set to <code>OPERATION_NOT_PERMITTED</code>. For details and example IAM policies, see <a href="https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html">Using IAM to Manage Access to Amazon SWF Workflows</a> in the <i>Amazon SWF Developer Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDetail'
        '480':
          description: UnknownResourceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownResourceFault'
        '481':
          description: OperationNotPermittedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotPermittedFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeDomainInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SimpleWorkflowService.DescribeDomain
        example: SimpleWorkflowService.DescribeDomain
      summary: Amazon SWF Describe Domain
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SimpleWorkflowService.DescribeDomain'
components:
  schemas:
    DurationInDays:
      type: string
      minLength: 1
      maxLength: 8
    UnknownResourceFault: {}
    DescribeDomainInput:
      type: object
      required:
      - name
      title: DescribeDomainInput
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain to describe.
    Arn:
      type: string
      minLength: 1
      maxLength: 1600
    RegistrationStatus:
      type: string
      enum:
      - REGISTERED
      - DEPRECATED
    DomainName:
      type: string
      minLength: 1
      maxLength: 256
    Description:
      type: string
      maxLength: 1024
    DomainDetail:
      type: object
      required:
      - domainInfo
      - configuration
      properties:
        domainInfo:
          allOf:
          - $ref: '#/components/schemas/DomainInfo'
          - description: The basic information about a domain, such as its name, status, and description.
        configuration:
          allOf:
          - $ref: '#/components/schemas/DomainConfiguration'
          - description: The domain configuration. Currently, this includes only the domain's retention period.
      description: Contains details of a domain.
    DomainInfo:
      type: object
      required:
      - name
      - status
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain. This name is unique within the account.
        status:
          allOf:
          - $ref: '#/components/schemas/RegistrationStatus'
          - description: <p>The status of the domain:</p> <ul> <li> <p> <code>REGISTERED</code> – The domain is properly registered and available. You can use this domain for registering types and creating new workflow executions. </p> </li> <li> <p> <code>DEPRECATED</code> – The domain was deprecated using <a>DeprecateDomain</a>, but is still in use. You should not create new workflow executions in this domain. </p> </li> </ul>
        description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The description of the domain provided through <a>RegisterDomain</a>.
        arn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The ARN of the domain.
      description: Contains general information about a domain.
    OperationNotPermittedFault: {}
    DomainConfiguration:
      type: object
      required:
      - workflowExecutionRetentionPeriodInDays
      properties:
        workflowExecutionRetentionPeriodInDays:
          allOf:
          - $ref: '#/components/schemas/DurationInDays'
          - description: The retention period for workflow executions in this domain.
      description: Contains the configuration settings of a domain.
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
