- hmac: []
tags:
- name: '#X Amz Target=SimpleWorkflowService.UndeprecateActivityType'
paths:
  /#X-Amz-Target=SimpleWorkflowService.UndeprecateActivityType:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UndeprecateActivityType
      description: 'Undeprecates a previously deprecated activity type. After an activity type has been undeprecated, you can create new tasks of that activity type.


        This operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.


        Access Control


        You can use IAM policies to control this action''s access to Amazon SWF resources as follows:


        Use a Resource element with the domain name to limit the action to only specified domains.


        Use an Action element to allow or deny permission to call this action.


        Constrain the following parameters by using a Condition element with the appropriate keys.


        activityType.name: String constraint. The key is swf:activityType.name.


        activityType.version: String constraint. The key is swf:activityType.version.


        If the caller doesn''t have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute''s cause parameter is set to OPERATION_NOT_PERMITTED. For details and example IAM policies, see Using IAM to Manage Access to Amazon SWF Workflows in the Amazon SWF Developer Guide.'
      responses:
        '200':
          description: Success
        '480':
          description: UnknownResourceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownResourceFault'
        '481':
          description: TypeAlreadyExistsFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeAlreadyExistsFault'
        '482':
          description: OperationNotPermittedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotPermittedFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndeprecateActivityTypeInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SimpleWorkflowService.UndeprecateActivityType
        example: SimpleWorkflowService.UndeprecateActivityType
      summary: Amazon SWF Undeprecate Activity Type
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SimpleWorkflowService.UndeprecateActivityType'
components:
  schemas:
    UnknownResourceFault: {}
    TypeAlreadyExistsFault: {}
    UndeprecateActivityTypeInput:
      type: object
      required:
      - domain
      - activityType
      title: UndeprecateActivityTypeInput
      properties:
        domain:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain of the deprecated activity type.
        activityType:
          allOf:
          - $ref: '#/components/schemas/ActivityType'
          - description: The activity type to undeprecate.
    Name:
      type: string
      minLength: 1
      maxLength: 256
    OperationNotPermittedFault: {}
    DomainName:
      type: string
      minLength: 1
      maxLength: 256
    ActivityType:
      type: object
      required:
      - name
      - version
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: <p>The name of this activity.</p> <note> <p>The combination of activity type name and version must be unique within a domain.</p> </note>
        version:
          allOf:
          - $ref: '#/components/schemas/Version'
          - description: <p>The version of this activity.</p> <note> <p>The combination of activity type name and version must be unique with in a domain.</p> </note>
      description: Represents an activity type.
    Version:
      type: string
      minLength: 1
      maxLength: 64
