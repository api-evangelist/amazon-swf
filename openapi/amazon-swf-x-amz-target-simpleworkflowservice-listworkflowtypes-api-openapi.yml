paths:
  /#X-Amz-Target=SimpleWorkflowService.ListWorkflowTypes:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListWorkflowTypes
      description: <p>Returns information about workflow types in the specified domain. The results may be split into multiple pages that can be retrieved by making the call repeatedly.</p> <p> <b>Access Control</b> </p> <p>You can use IAM policies to control this action's access to Amazon SWF resources as follows:</p> <ul> <li> <p>Use a <code>Resource</code> element with the domain name to limit the action to only specified domains.</p> </li> <li> <p>Use an <code>Action</code> element to allow or deny permission to call this action.</p> </li> <li> <p>You cannot use an IAM policy to constrain this action's parameters.</p> </li> </ul> <p>If the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's <code>cause</code> parameter is set to <code>OPERATION_NOT_PERMITTED</code>. For details and example IAM policies, see <a href="https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html">Using IAM to Manage Access to Amazon SWF Workflows</a> in the <i>Amazon SWF Developer Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTypeInfos'
        '480':
          description: OperationNotPermittedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotPermittedFault'
        '481':
          description: UnknownResourceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownResourceFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListWorkflowTypesInput'
      parameters:
      - name: maximumPageSize
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
        example: example
      - name: nextPageToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
        example: token123
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SimpleWorkflowService.ListWorkflowTypes
        example: SimpleWorkflowService.ListWorkflowTypes
      summary: Amazon SWF List Workflow Types
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SimpleWorkflowService.ListWorkflowTypes'
components:
  schemas:
    PageToken:
      type: string
      maxLength: 2048
    OperationNotPermittedFault: {}
    Description:
      type: string
      maxLength: 1024
    DomainName:
      type: string
      minLength: 1
      maxLength: 256
    WorkflowType:
      type: object
      required:
      - name
      - version
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: <p> The name of the workflow type.</p> <note> <p>The combination of workflow type name and version must be unique with in a domain.</p> </note>
        version:
          allOf:
          - $ref: '#/components/schemas/Version'
          - description: <p> The version of the workflow type.</p> <note> <p>The combination of workflow type name and version must be unique with in a domain.</p> </note>
      description: Represents a workflow type.
    RegistrationStatus:
      type: string
      enum:
      - REGISTERED
      - DEPRECATED
    WorkflowTypeInfos:
      type: object
      required:
      - typeInfos
      properties:
        typeInfos:
          allOf:
          - $ref: '#/components/schemas/WorkflowTypeInfoList'
          - description: The list of workflow type information.
        nextPageToken:
          allOf:
          - $ref: '#/components/schemas/PageToken'
          - description: <p>If a <code>NextPageToken</code> was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in <code>nextPageToken</code>. Keep all other arguments unchanged.</p> <p>The configured <code>maximumPageSize</code> determines how many results can be returned in a single call.</p>
      description: Contains a paginated list of information structures about workflow types.
    UnknownResourceFault: {}
    ReverseOrder:
      type: boolean
    Name:
      type: string
      minLength: 1
      maxLength: 256
    WorkflowTypeInfo:
      type: object
      required:
      - workflowType
      - status
      - creationDate
      properties:
        workflowType:
          allOf:
          - $ref: '#/components/schemas/WorkflowType'
          - description: The workflow type this information is about.
        status:
          allOf:
          - $ref: '#/components/schemas/RegistrationStatus'
          - description: The current status of the workflow type.
        description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The description of the type registered through <a>RegisterWorkflowType</a>.
        creationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date when this type was registered.
        deprecationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: If the type is in deprecated state, then it is set to the date when the type was deprecated.
      description: Contains information about a workflow type.
    ListWorkflowTypesInput:
      type: object
      required:
      - domain
      - registrationStatus
      title: ListWorkflowTypesInput
      properties:
        domain:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain in which the workflow types have been registered.
        name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: If specified, lists the workflow type with this name.
        registrationStatus:
          allOf:
          - $ref: '#/components/schemas/RegistrationStatus'
          - description: Specifies the registration status of the workflow types to list.
        nextPageToken:
          allOf:
          - $ref: '#/components/schemas/PageToken'
          - description: '<p>If <code>NextPageToken</code> is returned there are more results available. The value of <code>NextPageToken</code> is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return a <code>400</code> error: "<code>Specified token has exceeded its maximum lifetime</code>". </p> <p>The configured <code>maximumPageSize</code> determines how many results can be returned in a single call. </p>'
        maximumPageSize:
          allOf:
          - $ref: '#/components/schemas/PageSize'
          - description: 'The maximum number of results that are returned per call. Use <code>nextPageToken</code> to obtain further pages of results. '
        reverseOrder:
          allOf:
          - $ref: '#/components/schemas/ReverseOrder'
          - description: When set to <code>true</code>, returns the results in reverse order. By default the results are returned in ascending alphabetical order of the <code>name</code> of the workflow types.
    Timestamp:
      type: string
      format: date-time
    Version:
      type: string
      minLength: 1
      maxLength: 64
    PageSize:
      type: integer
      minimum: 0
      maximum: 1000
    WorkflowTypeInfoList:
      type: array
      items:
        $ref: '#/components/schemas/WorkflowTypeInfo'
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
