tags:
- name: '#X Amz Target=SimpleWorkflowService.SignalWorkflowExecution'
paths:
  /#X-Amz-Target=SimpleWorkflowService.SignalWorkflowExecution:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: SignalWorkflowExecution
      description: <p>Records a <code>WorkflowExecutionSignaled</code> event in the workflow execution history and creates a decision task for the workflow execution identified by the given domain, workflowId and runId. The event is recorded with the specified user defined signalName and input (if provided).</p> <note> <p>If a runId isn't specified, then the <code>WorkflowExecutionSignaled</code> event is recorded in the history of the current open workflow with the matching workflowId in the domain.</p> </note> <note> <p>If the specified workflow execution isn't open, this method fails with <code>UnknownResource</code>.</p> </note> <p> <b>Access Control</b> </p> <p>You can use IAM policies to control this action's access to Amazon SWF resources as follows:</p> <ul> <li> <p>Use a <code>Resource</code> element with the domain name to limit the action to only specified domains.</p> </li> <li> <p>Use an <code>Action</code> element to allow or deny permission to call this action.</p> </li> <li> <p>You cannot use an IAM policy to constrain this action's parameters.</p> </li> </ul> <p>If the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's <code>cause</code> parameter is set to <code>OPERATION_NOT_PERMITTED</code>. For details and example IAM policies, see <a href="https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html">Using IAM to Manage Access to Amazon SWF Workflows</a> in the <i>Amazon SWF Developer Guide</i>.</p>
      responses:
        '200':
          description: Success
        '480':
          description: UnknownResourceFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownResourceFault'
        '481':
          description: OperationNotPermittedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotPermittedFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalWorkflowExecutionInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SimpleWorkflowService.SignalWorkflowExecution
        example: SimpleWorkflowService.SignalWorkflowExecution
      summary: Amazon SWF Signal Workflow Execution
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SimpleWorkflowService.SignalWorkflowExecution'
components:
  schemas:
    OperationNotPermittedFault: {}
    WorkflowId:
      type: string
      minLength: 1
      maxLength: 256
    SignalWorkflowExecutionInput:
      type: object
      required:
      - domain
      - workflowId
      - signalName
      title: SignalWorkflowExecutionInput
      properties:
        domain:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          - description: The name of the domain containing the workflow execution to signal.
        workflowId:
          allOf:
          - $ref: '#/components/schemas/WorkflowId'
          - description: The workflowId of the workflow execution to signal.
        runId:
          allOf:
          - $ref: '#/components/schemas/WorkflowRunIdOptional'
          - description: The runId of the workflow execution to signal.
        signalName:
          allOf:
          - $ref: '#/components/schemas/SignalName'
          - description: The name of the signal. This name must be meaningful to the target workflow.
        input:
          allOf:
          - $ref: '#/components/schemas/Data'
          - description: Data to attach to the <code>WorkflowExecutionSignaled</code> event in the target workflow execution's history.
    UnknownResourceFault: {}
    DomainName:
      type: string
      minLength: 1
      maxLength: 256
    WorkflowRunIdOptional:
      type: string
      maxLength: 64
    SignalName:
      type: string
      minLength: 1
      maxLength: 256
    Data:
      type: string
      maxLength: 32768
